<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evaluation Mock API — Catalog</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css"
    integrity="sha384-wxLW6kwyHktdDGr6Pv1zgm/VGJh99lfUbzSn6HNHBENZlCN7W602k9VkGdxuFvPn"
    crossorigin="anonymous"
  />
  <style>
    body { margin: 0; background: #fafafa; }
    .catalog-header {
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 1.25rem 1.5rem;
      background: #1b1b1b;
      color: #f5f5f5;
    }
    .catalog-header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      font-weight: 600;
    }
    .catalog-header p {
      margin: 0;
      opacity: 0.85;
      font-size: 0.95rem;
    }
    .catalog-header a { color: #8ec8ff; }
    .catalog-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      margin-top: 0.75rem;
      font-size: 0.85rem;
    }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <header class="catalog-header">
    <h1>Evaluation Mock API</h1>
    <p>技術ノート評価用 Mock Experience API（OpenAPI 3.0.3）</p>
    <div class="catalog-meta">
      <span>Version 1.0.0</span>
      <a href="./openapi.yaml">openapi.yaml</a>
      <a href="https://evaluation-mock-api-47730621722.asia-northeast1.run.app/health">Live /health</a>
    </div>
  </header>
  <div id="swagger-ui"></div>
  <script
    src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"
    integrity="sha384-wmyclcVGX/WhUkdkATwhaK1X1JtiNrr2EoYJ+diV3vj4v6OC5yCeSu+yW13SYJep"
    crossorigin="anonymous"
  ></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "./openapi.yaml",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
      tryItOutEnabled: true,
    });
  </script>
</body>
</html>
